name: Deploy Infrastructure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: sa-east-1
      STACK_NAME: MidasBackendStack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Access
        run: |
          aws sts get-caller-identity

      - name: Discover AWS Account
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "Using account: $ACCOUNT_ID"

      - name: Check Bootstrap
        id: bootstrap
        run: |
          if aws ssm get-parameter \
            --name /cdk-bootstrap/hnb659fds/version >/dev/null 2>&1; then
            echo "bootstrap_exists=true" >> $GITHUB_OUTPUT
          else
            echo "bootstrap_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: CDK Bootstrap
        if: steps.bootstrap.outputs.bootstrap_exists == 'false'
        run: |
          cdk bootstrap aws://${{ steps.account.outputs.account_id }}/${{ env.AWS_REGION }}

      - name: Check Existing Stack
        continue-on-error: true
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Current status: $STATUS"

          if [[ "$STATUS" == "CREATE_IN_PROGRESS" ]] || \
             [[ "$STATUS" == "ROLLBACK_COMPLETE" ]] || \
             [[ "$STATUS" == "CREATE_FAILED" ]] || \
             [[ "$STATUS" == "ROLLBACK_FAILED" ]] || \
             [[ "$STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then

            echo "Deleting broken stack..."

            aws cloudformation delete-stack \
              --stack-name $STACK_NAME \
              --region $AWS_REGION

            aws cloudformation wait stack-delete-complete \
              --stack-name $STACK_NAME \
              --region $AWS_REGION

            echo "Stack deleted."
          fi

      - name: Verify CDK Installation
        run: |
          python -c "import aws_cdk; print('AWS CDK OK')"

      - name: CDK Synth
        run: |
          cdk synth

      - name: CDK Deploy
        run: |
          cdk deploy --all --require-approval never

      - name: List ECS Services
        if: success()
        run: |
          aws ecs list-services \
            --cluster midas-cluster \
            --region $AWS_REGION || true

      - name: Show CloudFormation Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --max-items 50